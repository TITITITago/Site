<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

     <header class="bg-dark py-3 sticky-top shadow-sm">
    <div class="container">
        <div class="row align-items-center g-3">
            <div class="col-12 col-md-3 text-center text-md-start">
                <a href="ProjetoFinal.html" class="text-white text-decoration-none fs-4 fw-bold">TechStore</a>
            </div>
            
            <div class="col-12 col-md-5">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="O que você procura hoje?"
                        aria-label="Pesquisar">
                    <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                </form>
            </div>
            
            <div class="col-12 col-md-4 text-center text-md-end d-flex align-items-center justify-content-center justify-content-md-end gap-4">
                
                <a href="Carrinho.html" class="text-white text-decoration-none small fw-semibold link-light d-inline-flex align-items-center text-primary">
                    <i class="bi bi-cart3 text-primary me-2 fs-5"></i> Carrinho (2)
                </a>

                <a href="Contato.html" class="text-white text-decoration-none small fw-semibold link-light d-inline-flex align-items-center active text-primary">
                    <i class="bi bi-person-plus-fill text-primary me-2 fs-5"></i> Cadastre-se
                </a>
                
            </div>
        </div>
    </div>
</header>

    <nav class="bg-white border-bottom py-2 shadow-sm" aria-label="Categorias">
        <div class="container">
            <div class="d-flex justify-content-center justify-content-md-start gap-3 overflow-auto py-1">
                <a href="Hardware.html" class="category-link"><i class="bi bi-cpu me-1"></i>Hardware</a>
                <a href="Periféricos.html" class="category-link"><i class="bi bi-mouse3 me-1"></i>Periféricos</a>
                <a href="Computadores.html" class="category-link"><i class="bi bi-pc-display me-1"></i>Computadores</a>
                <a href="Games.html" class="category-link"><i class="bi bi-controller me-1"></i>Games</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="bg-white p-4 p-sm-5 rounded shadow-sm border">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-badge text-primary" style="font-size: 3rem;"></i>
                        <h1 class="h3 fw-bold mt-2">Criar Conta</h1>
                        <p class="text-muted small">Crie seu perfil na TechStore para acompanhar pedidos, salvar favoritos e comprar com segurança.</p>
                    </div>

                    <form action="#" method="POST" class="needs-validation">
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold small">Nome Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome completo" required minlength="3">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">E-mail</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label fw-semibold small">Celular / WhatsApp</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000" pattern="[0-9\s\-\(\)]+" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label fw-semibold small">Senha de Acesso</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="No mínimo 6 caracteres" required minlength="6">
                            </div>
                            <div class="form-text text-muted" style="font-size: 0.75rem;">A senha deve conter pelo menos 6 dígitos.</div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                                <label class="form-check-label small text-muted" for="termos">
                                    Li e concordo com os <a href="#" class="text-decoration-none fw-semibold">Termos de Uso</a> e a <a href="#" class="text-decoration-none fw-semibold">Política de Privacidade</a> da TechStore.
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-check-circle me-2"></i>Finalizar Cadastro
                        </button>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-4 mt-5">
        <p class="m-0 small">&copy; 2026 TechStore - Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
